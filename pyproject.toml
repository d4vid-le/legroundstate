[project]
name = "pcb-enso"
version = "0.0.1"
description = "Latent-space energy-based routing research for KiCad, on Apple silicon with MLX"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mlx>=0.32.4",
    "numpy>=2.3",
    "pydantic>=2.12",
    "typer>=0.20",
    "rich>=14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcb_enso"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["boards", "third_party", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF"]
ignore = ["PLR2004"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
